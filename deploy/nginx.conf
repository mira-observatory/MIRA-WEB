server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    # Vite genera nombres con hash: estos recursos pueden cachearse.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # React Router resuelve /procedimientos y las demas rutas del navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
