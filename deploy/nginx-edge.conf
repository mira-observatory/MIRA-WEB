# Nginx del host: HTTPS publico, frontend local y API por la red privada.
# Instalar como /etc/nginx/sites-available/mira-web tras emitir el certificado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name proyectomira.org www.proyectomira.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name proyectomira.org www.proyectomira.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/proyectomira.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proyectomira.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MIRA_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # La barra final elimina /api/ antes de llamar al backend.
        proxy_pass http://10.108.0.4:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Uvicorn recibe UVICORN_ROOT_PATH=/api y genera el prefijo correcto.
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
    }
}
