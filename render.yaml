# Despliegue en Render como sitio estatico: el resultado de `npm run build` son
# archivos sueltos, no hay servidor propio.

services:
  - type: web
    name: mira-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # OJO: esto se usa al CONSTRUIR, no al servir. Vite lo incrusta dentro
      # del paquete de JavaScript, asi que cambiarlo despues no tiene ningun
      # efecto hasta que se vuelva a construir. Si el chat responde "hubo un
      # error consultando los datos" recien desplegado, esto es lo primero a
      # revisar.
      - key: VITE_API_BASE_URL
        sync: false

    routes:
      # La app es de una sola pagina: cualquier ruta la resuelve el navegador,
      # asi que todo lo que no sea un archivo real devuelve index.html en vez
      # de un 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # El navegador no debe adivinar el tipo de un archivo servido.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Nadie deberia poder incrustar el sitio en un iframe ajeno.
      - path: /*
        name: X-Frame-Options
        value: DENY
      # No filtrar la URL completa al navegar a otro sitio.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
